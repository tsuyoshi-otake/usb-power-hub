[package]
name = "usb-power-profiler"
version = "0.1.0"
edition = "2021"
description = "Native Win32 current profiler for the USB Power-Control Hub (issue #9)"
publish = false
build = "build.rs"

[dependencies.windows-sys]
version = "=0.61.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_Devices_Communication",
    "Win32_Storage_Xps",
]

[profile.release]
opt-level = 3
